[package]
name = "downloader"
version = "0.1.0"
edition = "2021"

# This line is ignored on macOS → warning is normal
windows_subsystem = "windows"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }